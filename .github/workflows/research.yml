name: Check research workspace
on:
  push:
    branches: [main]
    paths: ['research-projects/**', 'renv/**', 'renv.lock', '.Rprofile', '.github/workflows/research.yml']
  pull_request:
    paths: ['research-projects/**', 'renv/**', 'renv.lock', '.Rprofile', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-template:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Test inventory validation
        run: Rscript scripts/test-research.R
      - name: Render analytical template (no data or findings)
        run: quarto render research-projects/national-service/reports/report.qmd --execute
